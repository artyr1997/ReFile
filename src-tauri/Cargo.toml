[package]
name = "refile"
version = "0.1.0"
description = "ReFile — just files. A quiet file browser in the ReNote style."
authors = ["Artur Savytskyi"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "refile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
# PLAY: the library (SQLite), the songs' tags, the music folder, the audio, the radio's streams
rusqlite = { version = "0.41.0", features = ["bundled"] }
lofty = "0.25.5"
walkdir = "2.5.0"
rodio = { version = "0.23.0", features = ["symphonia-all"] }
ureq = "3"
# VIEW: comics (CBZ, CBR) and their pages' sizes
zip = "9.1.2"
unrar = "0.5.8"
imagesize = "0.15.0"
trash = "5.2.9"
tauri-plugin-opener = "2"
dirs = "7.0.0"
libc = "0.2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
